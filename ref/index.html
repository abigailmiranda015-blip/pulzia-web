<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>ref</title>
<body style="margin:0;background:#222"><p id="s" style="color:#fff">...</p>
<script>
const toB64=async u=>{const b=await (await fetch(u)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
(async()=>{const d={pie:await toB64('puli-ref-pie.jpg'),esc:await toB64('puli-ref-escritorio.jpg')};
const t=window.opener||window.parent; if(t&&t!==window){t.postMessage({pzref:d},'*');document.getElementById('s').textContent='enviado';}else document.getElementById('s').textContent='sin opener';})();
</script>
